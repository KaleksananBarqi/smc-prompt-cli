[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smc-prompt"
version = "0.1.0"
description = "Mechanical SMC/ICT [FAKTA] payload generator for a downstream text LLM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "pyperclip>=1.8.2",
    "click>=8.1.7",
    "jinja2>=3.1.2",
    # Reads the optional ``.env`` credential file (TWELVEDATA_API_KEY /
    # OANDA_API_TOKEN / OANDA_ACCOUNT_ID). The import is guarded so a broken
    # or missing install degrades to a WARN instead of crashing the CLI.
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Dev/test extra: `pip install -e ".[dev]"` then run `pytest`.
dev = ["pytest>=7.4.0"]

[project.scripts]
smc-prompt = "smc_prompt.cli:main"

[tool.setuptools]
packages = ["smc_prompt"]

[tool.setuptools.package-data]
smc_prompt = ["templates/*.j2"]

[tool.pytest.ini_options]
# The suite is network-free by design: the offline CSV source (#10) feeds the
# golden render fixture and the network fetcher is never called without a mock.
testpaths = ["tests"]
addopts = "-q"
